name: 🪟 Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: "🏗️ Build: windows-latest"
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-latest

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 💾 Cache Tauri tooling
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-deps-windows-latest-${{ hashFiles('package-lock.json', '**/Cargo.toml') }}
          restore-keys: |
            tauri-deps-windows-latest-

      - name: 🏗️ Build app (Unsigned CI)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json 2>&1 | tee build-windows.log

      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-latest
          retention-days: 7
          if-no-files-found: warn
          path: build-windows.log

      - name: 📤 Upload Windows bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-latest
          retention-days: 7
          if-no-files-found: error
          path: src-tauri/target/release/bundle
